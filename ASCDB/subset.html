<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCDB group</title>
<link rel="stylesheet" href="assets/style.css?v=20251115">
</head>
<body>
<div class="topbar"><div class="wrap">
  <a class="brand" href="./">ASC<span>DB</span></a>
  <nav class="toplinks">
    <a href="./">All groups</a>
    <a href="https://github.com/peverati/ASCDB">GitHub</a>
    <a class="logo-link" href="https://peverati.github.io" title="Peverati research group"><picture><source srcset="assets/logo-dark.png" media="(prefers-color-scheme: dark)"><img src="assets/logo-light.png" alt="Peverati research group" width="73" height="30"></picture></a>
  </nav>
</div></div>

<main class="wrap" id="main"><p class="empty">Loading…</p></main>

<script src="assets/3Dmol-min.js"></script>
<script src="assets/jszip.min.js"></script>
<script src="assets/app.js?v=20251115"></script>
<script src="assets/fnpicker.js?v=20251115"></script>
<script src="assets/stats.js?v=20251115"></script>
<script src="assets/inputs.js?v=20251115"></script>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get('id');
  if (!id || !/^[\w.\-]+$/.test(id)) throw new Error('no subset selected');
  const S = await loadJSON('data/subsets/' + encodeURIComponent(id) + '.json');
  document.title = `${S.name} – ASCDB`;

  const molFile = new Map(S.molecules.map(m => [m.name, m.file]));
  const UNITS = { kcal: ['kcal/mol', 2], kj: ['kJ/mol', 2], eh: ['Hartree (Eh)', 6] };
  let unit = 'kcal', page = 0, filter = '';
  const PAGE = 50;

  const molBtn = n => {
    const m = /^(\d+_)?(.*)$/.exec(n);
    return `<button class="mol" data-m="${esc(n)}" title="View in 3D">${m[1] ? `<i>${esc(m[1])}</i>` : ''}${esc(m[2])}</button>`;
  };
  const side = terms => terms.map(([c, m]) => `${Math.abs(c) !== 1 ? `<span class="coef">${Math.abs(c)}×</span>` : ''}${molBtn(m)}`).join('<span class="op">+</span>');
  const rxnHTML = r => {
    const re = r.terms.filter(t => t[0] < 0), pr = r.terms.filter(t => t[0] > 0);
    if (S.property || !re.length) return `<div class="rxn">${side(pr.length ? pr : r.terms)}</div>`;
    return `<div class="rxn">${side(re)}<span class="op">→</span>${side(pr)}</div>`;
  };
  const fmt = r => {
    if (S.property) return r.ref.value;
    const v = r.ref[unit];
    return v == null ? '' : v.toFixed(UNITS[unit][1]);
  };

  const refs = S.refs.length ? `<div class="article"><b>Original article${S.refs.length > 1 ? 's' : ''}</b><ul>${S.refs.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.text)}</a></li>`).join('')}</ul></div>` : '';

  $('#main').innerHTML = `
    <div class="crumbs"><a href="./">ASCDB</a> / <a href="./#db-${esc(S.db)}">${esc(S.category || S.dbName)}</a></div>
    <section class="sub-head">
      <h1>${esc(S.name)}</h1>
      ${S.description ? `<p class="desc">${esc(S.description)}</p>` : ''}
      <div class="meta">${esc(S.dbTitle)}${S.category ? ' · ' + esc(S.category) : ''} · ${S.reactions.length.toLocaleString()} ${S.property ? 'values' : 'reactions'} · ${S.molecules.length.toLocaleString()} molecules</div>
      ${refs}
      <div class="toolbar">
        ${S.property ? '' : `<label class="inline">Units
          <select class="btn" id="unit"><option value="kcal">kcal/mol</option><option value="kj">kJ/mol</option><option value="eh">Hartree (Eh)</option></select></label>`}
        <div class="fnpick" id="fnpick" hidden></div>
        <button class="btn primary" id="dlcsv">Download reference energies (.csv)</button>
        <button class="btn" id="dlfn" hidden>Download functional results (.csv)</button>
        <button class="btn primary" id="dlzip">Download structures (.zip)</button>
        <button class="btn" id="dlinp">Download input files…</button>
      </div>
      <p class="statnote jump" id="statjump" hidden>Scroll down to the bottom of the page, or <a href="#statsec">jump there</a>, for the overall statistics of the exchange-correlation functionals on this group.</p>
    </section>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-r" aria-selected="true">${S.property ? 'Values' : 'Reactions'}</button>
      <button class="tab" role="tab" id="t-m" aria-selected="false">Molecules</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Filter by molecule or reaction id…" autocomplete="off">
    <div style="height:12px"></div>
    <div id="view-r">
      <div class="tablewrap"><table>
        <thead><tr id="headrow"></tr></thead>
        <tbody id="rows"></tbody></table></div>
      <div class="pager" id="pager"></div>
    </div>
    <div id="view-m" hidden><div class="molgrid" id="mols"></div></div>
    <section class="statsec" id="statsec" hidden></section>
  `;

  /* ------------------------------------------------ functional results */
  S.reactions.forEach((r, i) => { r._i = i; });
  const FACTOR = { kcal: 1, kj: 4.184, eh: 1 / 627.5094740631 };
  let FD = null, stats = {}, sel = [], mode = 'err', fnSort = 'name';
  const SAVED = 'ascdb.functionals';
  const decs = () => UNITS[unit][1];
  const cv = v => v * FACTOR[unit];
  const signed = (v, d) => (v > 0 ? '+' : '') + v.toFixed(d);

  function cellHTML(r, name) {
    const e = FD[name][r._i];
    if (e == null) return '<td class="num fcol na">–</td>';
    const txt = mode === 'err' ? signed(cv(e), decs()) : (r.ref[unit] + cv(e)).toFixed(decs());
    const a = Math.min(1, Math.abs(e) / (2 * (stats[name].mue || 1))) * 0.35;
    return `<td class="num fcol" style="background:rgba(var(--${e > 0 ? 'pos' : 'neg'}),${a.toFixed(3)})" title="error ${signed(cv(e), decs())} ${UNITS[unit][0]}">${txt}</td>`;
  }

  function headHTML() {
    const ref = S.property ? 'Reference value' : `Reference (${UNITS[unit][0]})`;
    return `<th>#</th><th>ID</th><th>${S.property ? 'Molecule' : 'Reaction'}</th><th class="num">${ref}</th>` +
      sel.map(n => `<th class="num fcol" title="${mode === 'err' ? 'Signed error' : 'Calculated value'}, ${esc(n)}"><span>${esc(n)}</span><button class="fx" data-rm="${esc(n)}" aria-label="Remove ${esc(n)}" title="Remove column">×</button></th>`).join('');
  }

  function summaryHTML() {
    if (!sel.length) return '';
    const row = (label, key, title) => `<tr class="sumrow"><td colspan="3" title="${title}">${label}</td><td></td>` + sel.map(n => {
      const st = stats[n], v = cv(st[key]);
      const part = st.n < S.reactions.length ? `<small title="results available for ${st.n} of ${S.reactions.length} reactions"> (${st.n}/${S.reactions.length})</small>` : '';
      return `<td class="num fcol">${key === 'mse' ? signed(v, decs()) : v.toFixed(decs())}${part}</td>`;
    }).join('') + '</tr>';
    return row('Mean unsigned error (MUE)', 'mue', 'Mean of |calculated − reference|') + row('Mean signed error (MSE)', 'mse', 'Mean of (calculated − reference)');
  }

  function filtered() {
    const f = filter.trim().toLowerCase();
    if (!f) return S.reactions;
    return S.reactions.filter(r => r.id.toLowerCase().includes(f) || r.terms.some(t => t[1].toLowerCase().includes(f)));
  }

  function renderRows() {
    $('#headrow').innerHTML = headHTML();
    const list = filtered();
    const pages = Math.max(1, Math.ceil(list.length / PAGE));
    page = Math.min(page, pages - 1);
    const start = page * PAGE;
    $('#rows').innerHTML = summaryHTML() + (list.slice(start, start + PAGE).map((r, i) =>
      `<tr><td class="id">${start + i + 1}</td><td class="id">${esc(r.id)}</td><td>${rxnHTML(r)}</td><td class="num">${esc(fmt(r))}</td>${sel.map(n => cellHTML(r, n)).join('')}</tr>`).join('')
      || `<tr><td colspan="${4 + sel.length}" class="empty">No match.</td></tr>`);
    $('#pager').innerHTML = list.length > PAGE
      ? `<span>${start + 1}–${Math.min(start + PAGE, list.length)} of ${list.length.toLocaleString()}</span>
         <button class="btn" id="prev" ${page === 0 ? 'disabled' : ''}>‹ Prev</button>
         <span>${page + 1} / ${pages}</span>
         <button class="btn" id="next" ${page >= pages - 1 ? 'disabled' : ''}>Next ›</button>`
      : `<span>${list.length.toLocaleString()} shown</span>`;
    if ($('#prev')) { $('#prev').onclick = () => { page--; renderRows(); }; $('#next').onclick = () => { page++; renderRows(); }; }
  }

  function renderMols() {
    const f = filter.trim().toLowerCase();
    $('#mols').innerHTML = S.molecules.filter(m => !f || m.name.toLowerCase().includes(f)).map(m => molBtn(m.name)).join('') || '<p class="empty">No match.</p>';
  }

  let tab = 'r';
  function setTab(t) {
    tab = t;
    $('#t-r').setAttribute('aria-selected', t === 'r');
    $('#t-m').setAttribute('aria-selected', t === 'm');
    $('#view-r').hidden = t !== 'r';
    $('#view-m').hidden = t !== 'm';
    $('#q').placeholder = t === 'r' ? 'Filter by molecule or reaction id…' : 'Filter molecules…';
    t === 'r' ? renderRows() : renderMols();
  }
  $('#t-r').onclick = () => setTab('r');
  $('#t-m').onclick = () => setTab('m');
  $('#q').addEventListener('input', e => { filter = e.target.value; page = 0; tab === 'r' ? renderRows() : renderMols(); });
  if ($('#unit')) $('#unit').onchange = e => { unit = e.target.value; renderRows(); if (FD) { picker.refresh(); StatsUI.refresh(); } };
  $('#main').addEventListener('click', e => {
    const b = e.target.closest('.mol');
    if (b) Viewer.select(b.dataset.m, molFile.get(b.dataset.m));
  });

  /* picker and functional columns */
  let picker = null;
  function saveSel() { try { localStorage.setItem(SAVED, JSON.stringify(sel)); } catch (e) {} }
  function setSel(next) {
    sel = next; saveSel();
    $('#dlfn').hidden = !sel.length;
    picker.refresh(); renderRows(); StatsUI.refresh();
  }

  async function initFunctionals() {
    if (!S.fn) return;
    try { FD = (await loadJSON('data/functionals/' + encodeURIComponent(id) + '.json')).F; } catch (e) { return; }
    for (const [n, arr] of Object.entries(FD)) {
      let a = 0, s = 0, c = 0;
      for (const v of arr) if (v != null) { a += Math.abs(v); s += v; c++; }
      stats[n] = { mue: a / c, mse: s / c, n: c };
    }
    try { sel = (JSON.parse(localStorage.getItem(SAVED)) || []).filter(n => FD[n]); } catch (e) { sel = []; }
    picker = FnPicker.mount($('#fnpick'), {
      names: Object.keys(FD), mue: n => stats[n].mue,
      factor: () => FACTOR[unit], decs, unitLabel: () => UNITS[unit][0],
      getSel: () => sel,
      onToggle: (n, on) => setSel(on ? [...sel.filter(x => x !== n), n] : sel.filter(x => x !== n)),
      onClear: () => setSel([]),
      modes: true, onMode: m => { mode = m; renderRows(); },
      footer: `Columns show the signed error (calculated − reference) in the same sign convention as the reference column, or the calculated value. Source: ${esc(S.fnSource || 'results spreadsheet')}.${S.fnNote ? ' ' + esc(S.fnNote) : ''}`,
    });
    $('#dlfn').hidden = !sel.length;
    renderRows();
    $('#statjump').hidden = false;
    StatsUI.mount({
      S, FD, get unit() { return unit; },
      factor: () => FACTOR[unit], decs, unitLabel: () => UNITS[unit][0],
      isSel: n => sel.includes(n),
      toggle: (n, on) => setSel(on ? [...sel.filter(x => x !== n), n] : sel.filter(x => x !== n)),
    });
    $('#headrow').addEventListener('click', e => {
      const b = e.target.closest('.fx'); if (!b) return;
      setSel(sel.filter(x => x !== b.dataset.rm));
    });
    $('#dlfn').onclick = () => {
      const q = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
      const u = UNITS[unit][0];
      const head = ['id', 'reaction', `reference (${u})`, ...sel.map(n => `${n} ${mode === 'err' ? 'error' : 'value'} (${u})`)];
      const lines = S.reactions.map(r => {
        const re = r.terms.filter(t => t[0] < 0), pr = r.terms.filter(t => t[0] > 0);
        const s = t => t.map(([c, m]) => (Math.abs(c) !== 1 ? Math.abs(c) + ' ' : '') + m).join(' + ');
        const rx = re.length ? `${s(re)} -> ${s(pr)}` : s(pr);
        return [r.id, rx, r.ref[unit].toFixed(decs()), ...sel.map(n => { const e = FD[n][r._i]; return e == null ? '' : (mode === 'err' ? cv(e) : r.ref[unit] + cv(e)).toFixed(decs()); })].map(x => q(String(x))).join(',');
      });
      download(`${S.name}_functionals_${mode === 'err' ? 'errors' : 'values'}_${({ kcal: 'kcal', kj: 'kJ', eh: 'Eh' })[unit]}.csv`, new Blob([[head.map(q).join(','), ...lines].join('\n') + '\n'], { type: 'text/csv' }));
    };
  }

  /* ------------------------------------------------ downloads */
  $('#dlcsv').onclick = () => {
    const q = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
    // ACCDB-style layout: id,coef,molecule,...,value
    const lines = S.reactions.map(r => [r.id, ...r.terms.flatMap(([c, m]) => [c, m]), S.property ? r.ref.value : r.ref[unit]].map(x => q(String(x))).join(','));
    const suffix = S.property ? '' : '_' + ({ kcal: 'kcal', kj: 'kJ', eh: 'Eh' })[unit];
    download(`${S.name}_reference${suffix}.csv`, new Blob([lines.join('\n') + '\n'], { type: 'text/csv' }));
  };

  const citeText = `ASCDB group ${S.name} (${S.dbTitle})\n\nPlease cite the original work(s):\n` +
    S.refs.map(r => `- ${r.text}\n  ${r.url}`).join('\n') +
    `\n\nand the ASCDB database:\n- Morgante, P.; Peverati, R. Phys. Chem. Chem. Phys. 2019, 21, 19092-19103.\n  https://doi.org/10.1039/C9CP03211H\n`;
  $('#dlinp').onclick = () => InputFiles.open({ mols: S.molecules, title: S.name, zipName: S.name + '_inputs', cite: citeText });

  $('#dlzip').onclick = async e => {
    const btn = e.currentTarget, label = btn.textContent;
    btn.disabled = true;
    try {
      const zip = new JSZip(), dir = zip.folder(S.name + '_structures');
      const files = [...new Set(S.molecules.map(m => m.file).filter(Boolean))];
      let done = 0;
      for (let i = 0; i < files.length; i += 16) {
        await Promise.all(files.slice(i, i + 16).map(async f => { dir.file(f + '.xyz', await loadXYZ(f)); btn.textContent = `Preparing… ${++done}/${files.length}`; }));
      }
      dir.file('CITATION.txt', citeText + `\nThe second line of each xyz file holds "charge multiplicity".\n`);
      download(S.name + '_structures.zip', await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' }));
    } catch (err) { alert('Could not build the archive: ' + err.message); }
    btn.textContent = label; btn.disabled = false;
  };

  renderRows();
  Viewer.init();
  initFunctionals();
})().catch(e => {
  $('#main').innerHTML = `<p class="empty">Could not load this subset (${esc(e.message)}).<br><a href="./">← Back to all groups</a><br><small>If you opened this file directly from disk, serve the folder over HTTP, e.g. <code>python3 -m http.server</code>.</small></p>`;
});
</script>
</body>
</html>
